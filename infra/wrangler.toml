name = "pdf-to-flashcards-tutor"
main = "../worker/src/index.ts"
compatibility_date = "2024-10-01"

[observability]
logs = { enabled = true }

[ai]
binding = "AI"
remote = true

[[workflows]]
binding = "WORKFLOWS"
name = "workflows"
class_name = "Workflows"

[dev]
port = 8787

[vars]
# Model names used by Worker (can be overridden by environment)
LLM_MODEL = "@cf/meta/llama-3-8b-instruct"
TTS_MODEL = "@cf/xtts"
STT_MODEL = "@cf/openai/whisper"